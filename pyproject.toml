[project]
name = "cod-name-finder"
version = "2.2.2"
description = "Verified COD asset name discovery workbench"
requires-python = ">=3.11"
dependencies = ["PySide6>=6.8", "lz4>=4.4", "numpy>=2.0", "pyopencl>=2025.2"]

[project.scripts]
cod-name-finder = "finder.__main__:main"

[tool.pytest.ini_options]
testpaths = ["tests"]

